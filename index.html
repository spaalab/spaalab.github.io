<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SPAA Lab | IIT Dharwad</title>

  <meta
    name="description"
    content="SPAA Lab at IIT Dharwad — VLSI AI Accelerators, Edge Computing, Deep Learning, LLMs, Quantization and AI Optimization."
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      color: #102044;
      background: #ffffff;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1200px, 92%);
      margin: auto;
    }

    /* =========================================================
       NAVIGATION
    ========================================================= */

    nav {
      position: sticky;
      top: 0;
      z-index: 1000;

      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(14px);

      border-bottom: 1px solid #e8edf5;
    }

    .nav-inner {
      min-height: 78px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-mark {
      width: 48px;
      height: 48px;

      border: 2px solid #1468c9;
      border-radius: 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #1468c9;
      font-size: 21px;
      font-weight: 800;
    }

    .logo-title {
      font-size: 22px;
      font-weight: 800;
      color: #12234a;
      line-height: 1.1;
    }

    .logo-subtitle {
      font-size: 10px;
      letter-spacing: 2px;
      font-weight: 700;
      color: #53627c;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 27px;

      list-style: none;

      font-size: 14px;
      font-weight: 650;
    }

    .nav-links a {
      color: #253758;
      transition: 0.2s;
    }

    .nav-links a:hover {
      color: #1468c9;
    }


    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      min-height: 680px;

      display: flex;
      align-items: center;

      position: relative;

      background-image:
        linear-gradient(
          90deg,
          rgba(255,255,255,0.97) 0%,
          rgba(255,255,255,0.91) 27%,
          rgba(255,255,255,0.57) 53%,
          rgba(255,255,255,0.18) 80%,
          rgba(255,255,255,0.04) 100%
        ),
        url("git spaa lab .png");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .hero-content {
      max-width: 760px;
      padding: 80px 0;
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;

      font-weight: 800;
      color: #596b8b;

      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: clamp(55px, 8vw, 92px);
      line-height: 0.95;

      letter-spacing: -5px;

      color: #0c1c3c;

      margin-bottom: 25px;
    }

    .hero h1 span {
      color: #1468c9;
    }

    .hero-institute {
      font-size: 27px;
      font-weight: 700;

      color: #17284b;

      margin-bottom: 17px;
    }

    .hero-description {
      max-width: 650px;

      font-size: 18px;

      color: #52627d;

      margin-bottom: 32px;
    }

    .buttons {
      display: flex;
      gap: 13px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      padding: 14px 24px;

      border-radius: 999px;

      font-weight: 750;

      transition: 0.25s;
    }

    .btn-primary {
      background: #1468c9;
      color: #ffffff;

      box-shadow: 0 10px 25px rgba(20,104,201,0.22);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      background: #0d58ad;
    }

    .btn-secondary {
      background: rgba(255,255,255,0.92);

      color: #12234a;

      border: 1px solid #d6deea;
    }

    .btn-secondary:hover {
      transform: translateY(-2px);

      border-color: #1468c9;

      color: #1468c9;
    }


    /* =========================================================
       RESEARCH FOCUS BAR
    ========================================================= */

    .focus-bar {
      width: min(1120px, 88%);

      margin: -42px auto 0;

      position: relative;
      z-index: 5;

      background: rgba(255,255,255,0.95);

      backdrop-filter: blur(12px);

      border: 1px solid #e4ebf4;

      border-radius: 22px;

      box-shadow: 0 18px 50px rgba(28,55,90,0.10);

      display: grid;

      grid-template-columns: repeat(4, 1fr);

      padding: 24px;
    }

    .focus-item {
      display: flex;
      align-items: center;

      gap: 14px;

      padding: 5px 20px;

      border-right: 1px solid #dce4ee;
    }

    .focus-item:last-child {
      border-right: none;
    }

    .focus-icon {
      width: 47px;
      height: 47px;

      border-radius: 14px;

      background: #edf6ff;

      color: #1468c9;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 21px;

      flex-shrink: 0;
    }

    .focus-item h3 {
      font-size: 14px;
      color: #142653;
    }

    .focus-item p {
      font-size: 11px;
      color: #71809a;
    }


    /* =========================================================
       GENERAL SECTIONS
    ========================================================= */

    section {
      padding: 95px 0;
    }

    .section-label {
      text-align: center;

      text-transform: uppercase;

      letter-spacing: 4px;

      font-size: 11px;

      font-weight: 800;

      color: #72819a;

      margin-bottom: 10px;
    }

    .section-label::after {
      content: "";

      display: block;

      width: 46px;
      height: 3px;

      background: #d49b32;

      margin: 12px auto 0;
    }

    .section-title {
      text-align: center;

      font-size: 42px;

      letter-spacing: -1.5px;

      color: #102044;

      margin-bottom: 16px;
    }

    .section-description {
      max-width: 720px;

      margin: 0 auto 45px;

      text-align: center;

      color: #66748d;

      font-size: 17px;
    }


    /* =========================================================
       RESEARCH
    ========================================================= */
<style>
  .research-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 22px;
  }

  .research-card {
    padding: 32px;
    border-radius: 18px;
    border: 1px solid #e4ebf4;
    background: #ffffff;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }

  .research-card:hover,
  .research-card:focus-within {
    transform: translateY(-6px);
    box-shadow: 0 18px 40px rgba(24, 58, 100, 0.08);
    border-color: #c7dcf5;
  }

  .research-number {
    color: #1468c9;
    font-weight: 800;
    font-size: 14px;
    margin-bottom: 20px;
  }

  .research-card h3 {
    font-size: 21px;
    line-height: 1.3;
    color: #132550;
    margin-bottom: 12px;
  }

  .research-card p {
    color: #5b6a82;
    line-height: 1.7;
  }

  @media (max-width: 600px) {
    .research-card {
      padding: 24px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .research-card {
      transition: none;
    }
    .research-card:hover,
    .research-card:focus-within {
      transform: none;
    }
  }
</style>

<div class="research-grid">

  <div class="research-card">
    <div class="research-number">01</div>
    <h3>VLSI AI Accelerators</h3>
    <p>Hardware designs that run neural networks fast and with low power.</p>
  </div>

  <div class="research-card">
    <div class="research-number">02</div>
    <h3>Edge Computing</h3>
    <p>Running AI on small devices, close to where the data is produced.</p>
  </div>

  <div class="research-card">
    <div class="research-number">03</div>
    <h3>Quantization and AI Optimization</h3>
    <p>Making deep learning models and LLMs smaller and faster.</p>
  </div>

</div>
